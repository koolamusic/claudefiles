# claudefiles.yaml
name: koolamusic/claudefiles
description: Portable Claude Code configuration

install:
  # Where to copy files — "global" = ~/.claude/, "local" = ./.claude/ in current project
  targets:
    skills: skills/        # copy all skill dirs into <target>/skills/
    commands: commands/     # copy all .md files into <target>/commands/
    sounds: sounds/        # copy all files into <target>/sounds/
    hooks: hooks/          # copy all hook scripts into <target>/hooks/
    claude_md: dotfiles/CLAUDE.md  # deploy global CLAUDE.md to <target>/CLAUDE.md
    keybindings: dotfiles/keybindings.json  # deploy keybindings to <target>/keybindings.json (merge by context)
    nvim_plugins:
      source: dotfiles/nvim/lua/plugins/   # overlay plugin files onto existing nvim config
      dest: ~/.config/nvim/lua/plugins/
      skip_if_exists: true                  # never overwrite an existing plugin file
    # plugins/ are not copied by setup — Claude Code installs them from the
    # koolamusic/claudefiles marketplace via extraKnownMarketplaces in settings

settings:
  # These get smart-merged into the target settings.json
  hooks:
    SessionStart:
      - matcher: startup
        command: 'nohup {{sound_player}} $HOME/.claude/sounds/good-to-go-sir.wav >/dev/null 2>&1 &'
      - matcher: startup
        command: '$HOME/.claude/hooks/retro-reminder.sh'
        timeout: 5
    UserPromptSubmit:
      - matcher: '.*'
        command: "bash -c 'sounds=($HOME/.claude/sounds/orders-received.wav $HOME/.claude/sounds/affirmative.wav $HOME/.claude/sounds/right-away-sir.wav $HOME/.claude/sounds/read-you.wav $HOME/.claude/sounds/cant-believe.wav $HOME/.claude/sounds/this-too.wav $HOME/.claude/sounds/claudrophobic.wav); nohup {{sound_player}} \"${sounds[$RANDOM % ${#sounds[@]}]}\" >/dev/null 2>&1 &'"
    Stop:
      - matcher: '.*'
        command: "bash -c 'sounds=($HOME/.claude/sounds/jobs-finished.wav $HOME/.claude/sounds/orders-captain.wav $HOME/.claude/sounds/reporting-for-duty.wav); nohup {{sound_player}} \"${sounds[$RANDOM % ${#sounds[@]}]}\" >/dev/null 2>&1 &'"
    PostToolUse:
      - matcher: 'Edit|Write|Bash'
        command: '$HOME/.claude/hooks/retro-trigger.sh'
        timeout: 10
      - matcher: '.*'
        command: '$HOME/.claude/hooks/context-monitor.sh'  # context-usage warnings; requires jq
        timeout: 5
  plugins:
    - feature-dev@claude-plugins-official
    - ux@claudefiles
    - jira@claudefiles                    # primary sprint workflow — see plugins/jira/README.md
    - warden@claudefiles                  # acceptance test playbook, see plugins/warden/README.md
    - studio@claudefiles                  # per-project workflow workspace — clone or create ~/.studio/ before /studio:setup, see plugins/studio/README.md
  extraKnownMarketplaces:
    claudefiles:
      source:
        source: github
        repo: koolamusic/claudefiles
  preferences:
    alwaysThinkingEnabled: true

env: {}

platform:
  macos:
    sound_player: afplay
  linux:
    sound_player: aplay

experimental:
  # Opt-in features. /setup prompts whether to enable any of these during
  # installation. Each feature declares how opting in mutates settings.json:
  #   - `settings:` — a settings fragment deep-merged into the final
  #     settings.json (array-valued keys like hooks.PostToolUse are appended,
  #     not replaced). Used for wiring up hook scripts copied by default.
  #   - `enablePlugin:` — a plugin name (e.g. `<plugin>@<marketplace>`)
  #     that gets added to `enabledPlugins` on opt-in. Claude Code installs
  #     the plugin from its marketplace on next startup. Use for plugins
  #     that ship commands/agents and are NOT listed under top-level
  #     `settings.plugins:` (i.e. not default-enabled).
  #   - `skills:` — a list of skill directory names under `skills/` that
  #     are copied into `<target>/skills/` ONLY on opt-in. Step 5 of /setup
  #     skips them; every other skill is still copied by default. Use for
  #     a skill that only makes sense with an external tool installed.
  #   - `requires:` — external prerequisites checked before the feature is
  #     installed. Each entry names a `command:` looked up on PATH and an
  #     `install:` pointer (URL or one-liner) printed when it is missing.
  #     A missing prerequisite skips the feature and says why.
  #   - `run:` — shell commands executed in order after the `requires:`
  #     check passes. Use for a tool that installs its own command and
  #     hooks (so the catalogue points at it instead of carrying a copy
  #     that goes stale). A failing command stops the feature and is
  #     reported in the summary.
  # A feature MAY declare several keys; opt-in runs every declared action.
  # The backing files for `settings:` features (hook scripts, etc.) are
  # still copied by default — opt-in just wires them up. Users can flip
  # those on/off later by editing settings.json directly; a `skills:`
  # feature is toggled by re-running /setup or removing the skill dir.
  features:
    - name: trust-monitor
      description: >
        Per-session trust ladder for the agent. Sessions start at 50/100
        (L2 "Delegated"); the user awards points for good delivery and
        deducts on Fibonacci-scaled violations via /trust (minor -2,
        delivery -5, unverified -8, drift -8, fabrication -13, tamper
        -21); the agent self-reports at a flat -3. PreToolUse hard-gates
        tools by level (L1 edits, L2 mutating bash/agents, L3 push/PR/
        deploy/sends, L4 destructive) and terminates the agent below 20
        points. Statusline: opting in also points settings.json's
        statusLine at hooks/statusline-wrapper.sh, which renders the base
        statusline (gsd-statusline.js when installed, a minimal
        model/dir/context line otherwise) and appends the colored trust
        bar from 'trust-monitor.sh statusline <session_id>' (prints
        nothing when no ledger exists, so the line degrades cleanly).
        Requires jq. Files: hooks/trust-monitor.sh,
        hooks/trust-monitor.json, hooks/statusline-wrapper.sh,
        commands/trust.md.
      settings:
        statusLine:
          type: command
          command: 'bash "$HOME/.claude/hooks/statusline-wrapper.sh"'
        hooks:
          SessionStart:
            - matcher: 'startup|clear|resume'
              command: '$HOME/.claude/hooks/trust-monitor.sh'
              timeout: 5
          PreToolUse:
            - matcher: '.*'
              command: '$HOME/.claude/hooks/trust-monitor.sh'
              timeout: 5
          PostToolUse:
            - matcher: '.*'
              command: '$HOME/.claude/hooks/trust-monitor.sh'
              timeout: 5
    - name: tower
      description: >
        Runs the orchestrator skill's war room on visible Herdr panes so
        you can watch every child agent work instead of waiting on
        invisible background subagents. Commands: `tower on`, `tower off`,
        `tower status`. Assumes Herdr (https://herdr.dev) is installed and
        the session runs inside a Herdr-managed pane; depends on the
        `orchestrator` skill, which is installed by default. File:
        skills/tower/SKILL.md.
      skills: [tower]
      requires:
        - command: herdr
          install: https://herdr.dev
    - name: raydr
      description: >
        Hear your Claude Code sessions: raydr speaks replies, permission
        prompts, and notifications on your phone, and `/raydr` turns it
        on or off per session (`on`, `off`, `status`, or no argument to
        toggle). Nothing is copied from this repo. The raydr CLI owns
        the `/raydr` command and its three hooks (Stop, PreToolUse,
        Notification), so opting in runs its installer: `raydr hooks
        install` adds the hooks to ~/.claude/settings.json after backing
        it up and writes ~/.claude/commands/raydr.md beside it. Both stay
        current with the CLI. Then run `raydr init` once per machine to
        pick providers and write ~/.config/raydr/env, `raydr start`, and
        `raydr doctor` to check the setup. Requires the raydr CLI from
        the `@tensorkit/raydr` npm package
        (https://www.npmjs.com/package/@tensorkit/raydr, Node 24 or
        newer): `npm i -g @tensorkit/raydr`.
      requires:
        - command: raydr
          install: npm i -g @tensorkit/raydr
      run:
        - raydr hooks install

cleanup:
  # Files/dirs to remove after extraction is done (in the repo itself during development)
  - .resource/
